[project]
name = "pba-vision"
version = "0.2.0"
description = "Reconstruct 3-cushion billiards shot-by-shot ball positions from PBA broadcast VODs, validated against the official scoring terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "braces157" }]
keywords = ["billiards", "3-cushion", "computer-vision", "pba", "sports-analytics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Video :: Analysis",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "yt-dlp>=2024.10.22",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7"]

[project.scripts]
pba-vision = "pbavision.cli:main"

[project.urls]
Homepage = "https://github.com/braces157/pba-vision"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pbavision.align" = ["*.pem"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
